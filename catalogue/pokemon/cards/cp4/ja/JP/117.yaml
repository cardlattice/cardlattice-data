name: ヘッドノイザー（フレア団ハイパーギア）
pokemon:
  category: trainer
  subtypes:
    - Item
    - Pokémon Tool
  rules:
    - このポケモンのどうぐは、相手のポケモンEXにつけて使う。ポケモン1匹につき1枚だけつけられ、つけたままにする。
    - このカードをつけているポケモンが使うワザに必要なエネルギーは、{Colorless}エネルギー1個ぶん多くなる。
      ［このカードがポケモンからはがれたら、このカードを持ち主のトラッシュにおく。］
    - グッズは、自分の番に何枚でも使える。
illustrators:
  - 5ban Graphics
