name: 이스케이프 보드
pokemon:
  category: trainer
  subtypes:
    - Item
    - Pokémon Tool
  rules:
    - 포켓몬의 도구는 자신의 포켓몬에게 붙여서 사용한다. 포켓몬 1마리에게 1장만 붙일 수 있고 붙인 채로 둔다.
    - 이 카드를 붙이고 있는 포켓몬은 후퇴에 필요한 에너지가 1개분 적어지고 잠듦 또는 마비라도 후퇴할 수 있다.
    - 아이템은 자신의 차례에 몇 장이라도 사용할 수 있다.
illustrators:
  - Toyste Beach
regulationMark: B
