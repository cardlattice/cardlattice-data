name: 강철 프라이팬
pokemon:
  category: trainer
  subtypes:
    - Item
    - Pokémon Tool
  rules:
    - 포켓몬의 도구는 자신의 포켓몬에게 붙여서 사용한다. 포켓몬 1마리에게 1장만 붙일 수 있고 붙인 채로 둔다.
    - 이 카드를 붙이고 있는 {Metal} 포켓몬은 상대의 포켓몬으로부터 받는 기술의 데미지가 「-30」이 되고 약점도 없어진다.
    - 아이템은 자신의 차례에 몇 장이라도 사용할 수 있다.
illustrators:
  - Toyste Beach
regulationMark: B
