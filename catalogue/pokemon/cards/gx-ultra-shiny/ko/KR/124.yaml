name: 소원의 바통
pokemon:
  category: trainer
  subtypes:
    - Item
    - Pokémon Tool
  rules:
    - 포켓몬의 도구는 자신의 포켓몬에게 붙여서 사용한다. 포켓몬 1마리에게 1장만 붙일 수 있고 붙인 채로 둔다.
    - 이 카드를 붙이고 있는 포켓몬이 배틀필드에서 상대의 기술의 데미지를 받아 기절했을 때 그 포켓몬에게 붙어 있는 기본 에너지를 3장까지 자신의 벤치 포켓몬 1마리에게
      붙인다.
    - 아이템은 자신의 차례에 몇 장이라도 사용할 수 있다.
illustrators:
  - Toyste Beach
regulationMark: A
