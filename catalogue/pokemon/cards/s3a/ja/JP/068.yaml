  rules:
    - ポケモンのどうぐは、自分のポケモンにつけて使う。ポケモン1匹につき1枚だけつけられ、つけたままにする。
    - このカードをつけている「ポケモンVMAX」の最大HPは「100」小さくなり、そのポケモンが、相手のポケモンからワザのダメージを受けてきぜつしたとき、とられるサイドは1枚少なくなる。（このカードを手札からつけるとき、そのポケモンがきぜつするなら、つけられない。）
    - グッズは、自分の番に何枚でも使える。
