name: Darkness Energy
rarity: Rare
printedDenominator: 147
pokemon:
  category: energy
  subtypes:
    - Special Energy
  rules:
    - If the Pokémon Darkness Energy is attached to damages the Defending Pokémon (after applying Weakness and Resistance), the attack does 10 more damage to the Defending Pokémon.
    - At the end of every turn, put 1 damage counter on the Pokémon Darkness Energy is attached to, unless it’s Darkness or has Dark in its name.
    - Darkness Energy provides Darkness Energy. (Doesn’t count as a basic Energy card.)
