name: 메타그로스
illustrators:
  - Masakazu Fukuda
regulationMark: null
pokemon:
  category: pokemon
  hp: 100
  types:
    - Lightning
    - Metal
  stage: Stage 2
  evolvesFrom: 메탕구
  attacks:
    - name: 크래시번
      cost:
        - Lightning
        - Metal
      damage: 30+
      text: 원한다면 자신의 필드의 에너지를 원하는 만큼 트래쉬해도 좋다. 그 경우, 트래쉬한 에너지의 장수 ×20데미지를 추가한다.
  abilities:
    - name: 델타 컨트롤
      kind: Poké-Power
      text: 이 파워는 자신의 차례에 한 번 사용할 수 있다. 자신의 덱의 카드를 위에서부터 4장 보고 원하는 카드를 1장 선택해서 패로 가져온다. 그 뒤, 남은 카드를 원하는 순서대로 바꾸고 그
        덱의 아래로 되돌린다. 이 포켓몬이 특수 상태라면 이 파워를 사용할 수 없다.
  rules:
    - 이 포켓몬은 {Lightning} {Metal}의 2가지 타입이다.
  weaknesses:
    - type: Fire
  resistances:
    - type: Grass
      value: "-30"
  retreatCost: 3
  subtypes:
    - Delta Species
