name: 巨金怪
regulationMark: null
illustrators:
  - Masakazu Fukuda
pokemon:
  category: pokemon
  hp: 100
  types:
    - Lightning
    - Metal
  stage: Stage 2
  evolvesFrom: 金属怪
  subtypes:
    - Delta Species
  attacks:
    - name: 粉碎燃烧
      cost:
        - Lightning
        - Metal
      damage: 30+
      text: 若希望，可以将自己场上任意数量的能量放于弃牌区。在这种情况下，追加造成放于弃牌区的能量张数×20伤害。
  abilities:
    - name: 德尔塔控制
      kind: Poké-Power
      text: 在自己的回合可以使用1次这个力量。查看自己牌库上方4张卡牌，选择任意1张卡牌，加入手牌。然后，将剩余的卡牌以任意顺序重新排列，放回牌库下方。如果这只宝可梦处于特殊状态的话，则无法使用这个力量。
  weaknesses:
    - type: Fire
  resistances:
    - type: Grass
      value: "-30"
  retreatCost: 3
  rules:
    - 这只宝可梦是同时拥有{Lightning}和{Metal}两种属性的宝可梦。
