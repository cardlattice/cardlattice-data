name: Poké Pad
rarity: Common
finishes: [holo]
pokemon:
  category: trainer
  subtypes: [Item]
  rules:
    - Search your deck for a Pokémon that doesn’t have a Rule Box, reveal it, and put it into your
      hand. Then, shuffle your deck. (Pokémon ex, Pokémon V, etc. have Rule Boxes.)
    - You may play any number of Item cards during your turn.
