name: ツメの化石
pokemon:
  category: trainer
  hp: 40
  subtypes:
    - Item
  rules:
    - このカードは、{Colorless}の「たねポケモン」として場に出すことができる（このカードがきぜつしたら、相手プレイヤーはサイドを1枚とる）。このカードは特殊状態にならず、にげるができない。このカードの持ち主は、自分の番に、場からこのカードをトラッシュしてよい（この効果はきぜつではない）。
  abilities:
    - name: するどいせきしつ
      kind: Poké-Body
      text: このポケモンが、バトル場で相手のワザによるダメージを受けたとき（このポケモンがきぜつしても）、そのワザを使ったポケモンにダメージカウンターを1個のせる。
rarity: ●
illustrators:
  - Ryo Ueda
