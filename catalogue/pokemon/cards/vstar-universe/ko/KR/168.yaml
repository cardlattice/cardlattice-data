name: 축복마을
pokemon:
  category: trainer
  subtypes:
    - Stadium
  rules:
    - 서로의 플레이어는 자신의 차례마다 1번 자신의 패를 모두 덱으로 되돌리고 섞어도 좋다. 그 경우, 자신의 덱을 5장 뽑는다. 이 효과를 사용하면 자신의 차례는 끝난다.
    - 스타디움은 자신의 차례에 1장만 배틀필드 옆에 내놓을 수 있다. 다른 이름의 스타디움이 필드에 나오면 이 카드를 트래쉬한다.
illustrators:
  - Oswaldo KATO
regulationMark: F
