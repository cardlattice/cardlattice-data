name: 금랑
finishes: [holo]
pokemon:
  category: trainer
  subtypes:
    - Supporter
  rules:
    - 이 카드는 상대의 이전 차례에 자신의 포켓몬이 기절하지 않으면 사용할 수 없다. 자신의 트래쉬에서 기본 에너지를 1장 선택해서 자신의 포켓몬에게 붙인다. 그 뒤, 자신의
      덱에서 원하는 카드를 1장 선택해서 패로 가져온다. 그리고 덱을 섞는다.
    - 서포트는 자신의 차례에 1장만 사용할 수 있다.
illustrators:
  - GIDORA
rarity: SAR
regulationMark: E
