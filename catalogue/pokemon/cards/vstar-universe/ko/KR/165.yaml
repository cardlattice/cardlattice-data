name: 무너진 스타디움
pokemon:
  category: trainer
  subtypes:
    - Stadium
  rules:
    - 서로의 플레이어가 벤치로 내보낼 수 있는 포켓몬의 수는 4마리가 된다. (벤치의 수를 변경하는 효과는 적은 수를 우선한다.) (이 카드가 필드에 나왔을 때 벤치에 5마리
      이상 있는 플레이어는 4마리가 될 때까지 트래쉬한다. 트래쉬를 하는 것은 이 카드의 주인부터 한다.)
    - 스타디움은 자신의 차례에 1장만 배틀필드 옆에 내놓을 수 있다. 다른 이름의 스타디움이 필드에 나오면 이 카드를 트래쉬한다.
illustrators:
  - Oswaldo KATO
regulationMark: F
