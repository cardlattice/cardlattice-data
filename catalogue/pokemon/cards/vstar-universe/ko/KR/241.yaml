name: 자크로
finishes: [holo]
pokemon:
  category: trainer
  subtypes:
    - Supporter
  rules:
    - 이 차례에 자신의 {Fighting} 포켓몬이 사용하는 기술이 상대의 배틀 포켓몬에게 주는 데미지는 「+30」이 된다. 자신의 차례에 자신의 패(「자크로」는 제외)를
      2장 트래쉬한다면 이 「자크로」를 자신의 트래쉬에서 상대에게 보여주고 패로 가져온다. (이 효과는 자신의 차례에 사용할 수 있는 서포트의 장수에 포함하지 않는다.)
    - 서포트는 자신의 차례에 1장만 사용할 수 있다.
illustrators:
  - Oswaldo KATO
rarity: SAR
regulationMark: F
