name: 히스이의 헤비볼
finishes: [non-holo, reverse-holo]
pokemon:
  category: trainer
  subtypes:
    - Item
  rules:
    - 뒷면으로 된 자신의 프라이즈의 앞면을 모두 본다. 그 중에서 기본 포켓몬을 1장 선택해서 상대에게 보여주고 이 「히스이의 헤비볼」과 바꾸어 패로 가져온다. 보았던
      프라이즈나 교체한 카드는 모두 뒷면으로 하여 섞고 프라이즈로 놓는다.
    - 아이템은 자신의 차례에 몇 장이라도 사용할 수 있다.
illustrators:
  - Studio Bora Inc.
regulationMark: F
