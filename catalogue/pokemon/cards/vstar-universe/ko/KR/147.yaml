name: 하늘의 봉인석
finishes: [holo]
pokemon:
  category: trainer
  subtypes:
    - Item
    - Pokémon Tool
  rules:
    - 포켓몬의 도구는 자신의 포켓몬에게 붙여서 사용한다. 포켓몬 1마리에게 1장만 붙일 수 있고 붙인 채로 둔다.
    - 이 카드를 붙이고 있는 「포켓몬 V」는 이 VSTAR 파워를 사용할 수 있다.
    - 아이템은 자신의 차례에 몇 장이라도 사용할 수 있다.
  abilities:
    - name: 스타오더
      kind: Ability
      power: VSTAR
      text: 자신의 차례에 사용할 수 있다. 이 차례에 자신의 기본 포켓몬인 「포켓몬 V」가 사용하는 기술의 데미지로 상대 배틀필드의 「포켓몬 VSTAR・VMAX」가 기절했다면
        프라이즈를 1장 더 가져온다. (대전 중 자신은 VSTAR 파워를 1번만 사용할 수 있다.)
illustrators:
  - AYUMI ODASHIMA
regulationMark: F
