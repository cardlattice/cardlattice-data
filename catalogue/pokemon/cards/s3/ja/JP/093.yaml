name: もくもくスモーク
pokemon:
  category: trainer
  subtypes:
    - Pokémon Tool
    - Item
  rules:
    - ポケモンのどうぐは、自分のポケモンにつけて使う。ポケモン1匹につき1枚だけつけられ、つけたままにする。
    - このカードをつけているポケモンが、相手のポケモンからワザのダメージを受けてきぜつしたとき、そのポケモンがきぜつしたことで相手がとるサイドは、手札には加えず、トラッシュする。
    - グッズは、自分の番に何枚でも使える。
rarity: U
illustrators:
  - 5ban Graphics
