name: 메탈코어 배리어
pokemon:
  category: trainer
  subtypes:
    - Item
    - Pokémon Tool
  rules:
    - 포켓몬의 도구는 자신의 포켓몬에게 붙여서 사용한다. 포켓몬 1마리에게 1장만 붙일 수 있고 붙인 채로 둔다.
    - 포켓몬에게 붙어 있는 이 카드는 상대의 다음 차례 마지막에 트래쉬한다. 이 카드를 붙이고 있는 {Metal} 포켓몬이 상대의 포켓몬으로부터 받는 기술의 데미지는
      「-70」이 된다.
    - 아이템은 자신의 차례에 몇 장이라도 사용할 수 있다.
illustrators:
  - Studio Bora Inc.
regulationMark: C
