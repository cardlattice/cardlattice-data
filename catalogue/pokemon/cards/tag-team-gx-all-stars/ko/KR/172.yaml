name: 초 부스트 에너지[프리즘스타]
pokemon:
  category: energy
  subtypes:
    - Special Energy
    - Prism Star
  rules:
    - 이 카드는 {Colorless} 에너지 1개분으로 작용한다. 이 카드는 2진화 포켓몬에게 붙어 있는 한, 모든 타입의 에너지 1개분으로 작용하고 자신의 필드에 2진화
      포켓몬이 3마리 이상 있다면 모든 타입의 에너지 4개분으로 작용한다.
    - 같은 이름의 [프리즘스타](프리즘스타)의 카드는 덱에 1장만 넣을 수 있다. 트래쉬하지 않고 로스트존에 둔다.
  types:
    - Colorless
rarity: PR
regulationMark: B
