name: 태홍[프리즘스타]
finishes: [holo]
pokemon:
  category: trainer
  subtypes:
    - Supporter
    - Prism Star
  rules:
    - 이 카드는 자신의 배틀필드에 {Water} 또는 {Metal} 포켓몬이 없다면 사용할 수 없다. 상대는 상대 자신의 벤치 포켓몬이 2마리가 될 때까지 포켓몬과 붙어 있는
      모든 카드를 덱으로 되돌리고 섞는다.
    - 서포트는 자신의 차례에 1장만 사용할 수 있다.
    - 같은 이름의 [프리즘스타](프리즘스타)의 카드는 덱에 1장만 넣을 수 있다. 트래쉬하지 않고 로스트존에 둔다.
illustrators:
  - Masakazu Fukuda
rarity: PR
regulationMark: B
