name: 커스텀 캐처
finishes: [reverse-holo]
pokemon:
  category: trainer
  subtypes:
    - Item
  rules:
    - 「커스텀 캐처」는 1장 또는 2장 동시에 사용할 수 있으며 사용한 장수에 따라 효과가 변한다. ◆1장 사용하면 자신의 패가 3장이 되도록 덱을 뽑는다. ◆2장 동시에
      사용하면 상대의 벤치 포켓몬을 1마리 선택해서 배틀 포켓몬과 교체한다. (이 효과는 2장으로 1번 작용한다.)
    - 아이템은 자신의 차례에 몇 장이라도 사용할 수 있다.
illustrators:
  - Toyste Beach
regulationMark: B
