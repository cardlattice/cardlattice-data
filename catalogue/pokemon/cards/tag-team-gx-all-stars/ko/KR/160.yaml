name: 거대한 화덕
pokemon:
  category: trainer
  subtypes:
    - Stadium
  rules:
    - 서로의 플레이어는 자신의 차례마다 1번 자신의 패를 1장 트래쉬해도 좋다. 그 경우, 자신의 덱에 있는 {Fire} 에너지를 2장까지 상대에게 보여주고 패로 가져온다.
      그리고 덱을 섞는다.
    - 스타디움은 자신의 차례에 1장만 배틀필드 옆에 내놓을 수 있다. 다른 이름의 스타디움이 필드에 나오면 이 카드를 트래쉬한다.
illustrators:
  - 5ban Graphics
regulationMark: C
