name: 원더래버린스[프리즘스타]
finishes: [holo]
pokemon:
  category: trainer
  subtypes:
    - Stadium
    - Prism Star
  rules:
    - 서로의 필드의 포켓몬({Fairy} 포켓몬은 제외)이 사용하는 기술에 필요한 에너지는 각각 {Colorless} 에너지 1개만큼 많아진다. 이 스타디움은 필드에 나와
      있는 한, 서로의 플레이어가 패에서 아이템 또는 서포트를 꺼내서 사용했을 때 그 효과를 받지 않는다.
    - 스타디움은 자신의 차례에 1장만 배틀필드 옆에 내놓을 수 있다. 다른 이름의 스타디움이 필드에 나오면 이 카드를 트래쉬한다.
    - 같은 이름의 [프리즘스타](프리즘스타)의 카드는 덱에 1장만 넣을 수 있다. 트래쉬하지 않고 로스트존에 둔다.
illustrators:
  - 5ban Graphics
rarity: PR
regulationMark: B
