name: 이슬&칸나
finishes: [reverse-holo]
pokemon:
  category: trainer
  subtypes:
    - Supporter
    - TAG TEAM
  rules:
    - 자신의 덱에 있는 {Water} 에너지를 3장까지 상대에게 보여주고 패로 가져온다. 그리고 덱을 섞는다. 추가로 이 카드를 사용할 때 자신의 패를 5장 트래쉬해도 좋다.
      그 경우, 이 차례에 자신의 {Water} 포켓몬은 자신이 이미 GX기술을 사용했어도 GX기술을 사용할 수 있다.
    - 서포트는 자신의 차례에 1장만 사용할 수 있다.
illustrators:
  - Megumi Mizutani
regulationMark: C
