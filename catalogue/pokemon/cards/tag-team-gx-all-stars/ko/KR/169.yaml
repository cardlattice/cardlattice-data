name: 히트팩토리[프리즘스타]
pokemon:
  category: trainer
  subtypes:
    - Stadium
    - Prism Star
  rules:
    - 서로의 플레이어는 자신의 차례마다 1번 자신의 패에 있는 {Fire} 에너지를 1장 트래쉬해도 좋다. 트래쉬한 경우, 자신의 덱을 3장 뽑는다. 이 스타디움은 필드에
      나와 있는 한, 서로의 플레이어가 패에서 아이템 또는 서포트를 꺼내서 사용했을 때 그 효과를 받지 않는다.
    - 스타디움은 자신의 차례에 1장만 배틀필드 옆에 내놓을 수 있다. 다른 이름의 스타디움이 필드에 나오면 이 카드를 트래쉬한다.
    - 같은 이름의 [프리즘스타](프리즘스타)의 카드는 덱에 1장만 넣을 수 있다. 트래쉬하지 않고 로스트존에 둔다.
illustrators:
  - 5ban Graphics
rarity: PR
regulationMark: B
