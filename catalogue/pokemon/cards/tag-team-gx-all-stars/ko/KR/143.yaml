name: 카운터 게인
pokemon:
  category: trainer
  subtypes:
    - Item
    - Pokémon Tool
  rules:
    - 포켓몬의 도구는 자신의 포켓몬에게 붙여서 사용한다. 포켓몬 1마리에게 1장만 붙일 수 있고 붙인 채로 둔다.
    - 자신의 남은 프라이즈 장수가 상대보다 많다면 이 카드를 붙이고 있는 포켓몬이 사용하는 기술에 필요한 에너지는 {Colorless} 에너지 1개만큼 적어진다.
    - 아이템은 자신의 차례에 몇 장이라도 사용할 수 있다.
illustrators:
  - Toyste Beach
regulationMark: B
