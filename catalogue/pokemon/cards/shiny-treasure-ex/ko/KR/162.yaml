name: 일렉트릭 제너레이터
finishes: [non-holo, reverse-holo]
pokemon:
  category: trainer
  subtypes:
    - Item
  rules:
    - 자신의 덱을 위에서부터 5장 보고 그 중에서 「기본 {Lightning} 에너지」를 2장까지 선택해서 벤치의 {Lightning} 포켓몬에게 원하는 대로 붙인다. 남은
      카드는 덱으로 되돌리고 섞는다.
    - 아이템은 자신의 차례에 몇 장이라도 사용할 수 있다.
illustrators:
  - Toyste Beach
