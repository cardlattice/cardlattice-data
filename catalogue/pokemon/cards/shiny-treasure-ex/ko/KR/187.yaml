name: 포켓몬리그본부
finishes: [non-holo, reverse-holo]
pokemon:
  category: trainer
  subtypes:
    - Stadium
  rules:
    - 서로의 필드의 기본 포켓몬이 기술을 사용하기 위한 에너지는 각각 {Colorless} 에너지 1개만큼 많아진다.
    - 스타디움은 자신의 차례에 1장 배틀필드 옆에 내놓을 수 있다. 다른 스타디움이 필드에 나오면 이 카드를 트래쉬한다. 같은 이름의 스타디움은 필드에 내보낼 수 없다.
illustrators:
  - Oswaldo KATO
