name: 기술머신 위기극복한방
finishes: [non-holo, reverse-holo]
pokemon:
  category: trainer
  subtypes:
    - Pokémon Tool
  rules:
    - 이 카드를 붙이고 있는 포켓몬은 이 카드에 적혀 있는 기술을 사용할 수 있다. (기술을 사용하기 위한 에너지는 필요하다.)
    - 포켓몬에게 붙어 있는 이 카드는 자신의 차례의 마지막에 트래쉬한다.
    - 포켓몬의 도구는 자신의 차례에 몇 장이라도 자신의 포켓몬에게 붙일 수 있다. 포켓몬 1마리에게 1장만 붙일 수 있고 붙인 채로 둔다.
  attacks:
    - name: 위기극복한방
      cost:
        - Colorless
        - Colorless
        - Colorless
      damage: "280"
      text: 이 기술은 상대의 남은 프라이즈 장수가 1장일 때만 사용할 수 있다.
illustrators:
  - Studio Bora Inc.
