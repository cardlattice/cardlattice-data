name: リバースバレー
pokemon:
  category: trainer
  subtypes:
    - Stadium
  rules:
    - このカードは、上下の向きを選んでから場に出す。こちら側のプレイヤーの場にいる{Metal}ポケモンが、相手のポケモンから受けるワザのダメージは「-10」される。
    - このカードは、上下の向きを選んでから場に出す。こちら側のプレイヤーの場にいる{Darkness}ポケモンが使うワザの、相手のバトルポケモンへのダメージは「+10」される。
    - スタジアムは、自分の番に1枚だけ、バトル場の横に出せる。別の名前のスタジアムが場に出たなら、このカードをトラッシュする。
rarity: U
illustrators:
  - 5ban Graphics
