name: 炸裂バルーン
pokemon:
  category: trainer
  subtypes:
    - Item
    - Pokémon Tool
  rules:
    - ポケモンのどうぐは、自分のポケモンにつけて使う。ポケモン1匹につき1枚だけつけられ、つけたままにする。
    - ポケモンについているこのカードは、相手の番の終わりにトラッシュする。
      このカードをつけているポケモンが、バトル場で相手のポケモンからワザのダメージを受けたとき、ワザを使ったポケモンにダメカンを6個のせる。
    - グッズは、自分の番に何枚でも使える。
rarity: U
illustrators:
  - Toyste Beach
