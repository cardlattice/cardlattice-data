name: ブラックマーケット◇
pokemon:
  category: trainer
  subtypes:
    - Stadium
    - Prism Star
  rules:
    - おたがいの{Darkness}エネルギーがついている{Darkness}ポケモンが、相手のポケモンからワザのダメージを受けてきぜつしたとき、とられるサイドは1枚少なくなる。
      このスタジアムは、場に出ているかぎり、おたがいのプレイヤーが手札からグッズまたはサポートを出して使ったとき、その効果を受けない。
    - スタジアムは、自分の番に1枚だけ、バトル場の横に出せる。別の名前のスタジアムが場に出たなら、このカードをトラッシュする。
    - 同じ名前の◇（プリズムスター）のカードは、デッキに1枚しか入れられない。トラッシュには行かず、ロストゾーンに置く。
illustrators:
  - 5ban Graphics
rarity: PR
