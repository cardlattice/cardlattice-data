name: カオスタワー
pokemon:
  category: trainer
  subtypes:
    - Stadium
  rules:
    - このカードは、上下の向きを選んでから場に出す。こちら側のプレイヤーの場にいるポケモンはどくとこんらんにならない。（受けているどくとこんらんは、すべて回復する。）
    - このカードは、上下の向きを選んでから場に出す。こちら側のプレイヤーの場にいるポケモンはねむりとマヒにならない。（受けているねむりとマヒは、すべて回復する。）
    - スタジアムは、自分の番に1枚だけ、バトル場の横に出せる。別の名前のスタジアムが場に出たなら、このカードをトラッシュする。
rarity: U
illustrators:
  - 5ban Graphics
