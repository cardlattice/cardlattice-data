name: Rare Candy
rarity: Uncommon
illustrators:
  - Ryo Ueda
pokemon:
  category: trainer
  subtypes:
    - Item
  rules:
    - Choose 1 of your Basic Pokémon in play. If you have a Stage 2 card in your hand that evolves
      from that Pokémon, put that card on the Basic Pokémon. (This counts as evolving that Pokémon.)
      You can't use this card during your first turn or on a Basic Pokémon that was put into play
      this turn.
    - You may play as many Item cards as you like during your turn (before your attack).
finishes:
  - non-holo
  - reverse-holo
