name: Conventional commits
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: read
jobs:
  title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      # No PR code is checked out or executed with the base repository token.
      - name: Validate the current PR title
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const pattern = /^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([^\r\n()]+\))?!?: \S(?:[^\r\n]*\S)?$/;
          (async () => {
            const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/pulls/${event.pull_request.number}`, {
              headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json' },
            });
            if (!response.ok) throw new Error(`Cannot read PR: HTTP ${response.status}`);
            const pr = await response.json();
            if (!pattern.test(pr.title)) throw new Error('PR title must use Conventional Commits, for example: feat(data): add Japanese cards');
            console.log('PR title follows Conventional Commits.');
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          JS
  commits:
    name: Conventional commit messages
    runs-on: ubuntu-latest
    steps:
      - name: Validate every commit in the PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const pattern = /^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([^\r\n()]+\))?!?: \S(?:[^\r\n]*\S)?$/;
          (async () => {
            const headers = { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json' };
            const current = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/pulls/${event.pull_request.number}`, { headers });
            if (!current.ok) throw new Error(`Cannot read PR: HTTP ${current.status}`);
            const pr = await current.json();
            let count = 0;
            for (let page = 1; ; page++) {
              const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/pulls/${event.pull_request.number}/commits?per_page=100&page=${page}`, {
                headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json' },
              });
              if (!response.ok) throw new Error(`Cannot read commits: HTTP ${response.status}`);
              const commits = await response.json();
              for (const commit of commits) {
                if (!pattern.test(commit.commit.message.split('\n')[0])) throw new Error(`Commit ${commit.sha} must use Conventional Commits.`);
                count++;
              }
              if (commits.length < 100) break;
            }
            if (!count || count !== pr.commits) throw new Error('Incomplete commit list; split oversized PRs rather than skipping validation.');
            console.log(`Validated ${count} commit messages.`);
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          JS
