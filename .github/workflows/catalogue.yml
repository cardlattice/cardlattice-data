name: Catalogue
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  schema:
    name: Validate Pokémon YAML schema
    runs-on: ubuntu-24.04
    outputs:
      build-needed: ${{ steps.changes.outputs.needed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
      - run: npm install --global pnpm@12.18.0
      - run: pnpm install --frozen-lockfile
      - name: Detect catalogue changes
        id: changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/catalogue-build-needed.ts "$BASE_SHA"
      - name: Check validator formatting, lint, types and tests
        run: pnpm check:tools
      - name: Validate only changed PR data
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: pnpm validate:schema --changed-from "$BASE_SHA"
      - name: Validate the full main catalogue
        if: github.event_name != 'pull_request'
        run: pnpm validate:schema
      - run: pnpm audit
  build:
    name: Validate data and build catalogue
    needs: schema
    if: github.event_name != 'pull_request' || needs.schema.outputs.build-needed == 'true'
    runs-on: ubuntu-24.04
    outputs:
      source: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read pinned compiler and source revision
        id: source
        shell: bash
        run: |
          ref="$(cat builder-ref.txt)"
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]]
          printf 'builder=%s\n' "$ref" >> "$GITHUB_OUTPUT"
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cardlattice/cardlattice
          ref: ${{ steps.source.outputs.builder }}
          path: .builder
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
      - name: Install Rust
        run: rustup update stable && rustup default stable
      - name: Cache Rust compiler and dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: .builder -> target
          key: ${{ steps.source.outputs.builder }}
          cache-workspace-crates: 'true'
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Compile catalogue tool
        run: cargo build --locked --manifest-path .builder/Cargo.toml -p cardlattice-api --bin cardlattice-api
      - name: Full data validation and compiler regressions on main
        if: github.event_name != 'pull_request'
        run: ./scripts/check.sh
      - name: Build and prove reproducibility
        shell: bash
        run: |
          ./scripts/build.sh
          cp dist/manifest.json /tmp/manifest-first.json
          ./scripts/build.sh
          cmp dist/manifest.json /tmp/manifest-first.json
          sha256sum dist/catalogue-*.json
      - name: Build catalogue status page
        run: node scripts/build-status.ts
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: site/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catalogue-${{ steps.source.outputs.commit }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
  pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy catalogue status
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
  release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    concurrency:
      group: daily-catalogue-release
      cancel-in-progress: false
    steps:
      - name: Download this run's verified artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_COMMIT: ${{ needs.build.outputs.source }}
        run: gh run download "$RUN_ID" --name "catalogue-$SOURCE_COMMIT" --dir dist
      - name: Publish at most one immutable release per UTC day
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_COMMIT: ${{ needs.build.outputs.source }}
        shell: bash
        run: |
          day="$(date -u +%F)"
          tag="catalogue-$day"
          if gh release view "$tag" >/dev/null 2>&1; then
            printf 'Release %s already exists; leaving it unchanged.\n' "$tag"
            exit 0
          fi
          printf 'Reviewed catalogue built from commit %s. Verify manifest.json before indexing.\n' "$SOURCE_COMMIT" > release-notes.txt
          gh release create "$tag" dist/* --target "$SOURCE_COMMIT" \
            --title "Catalogue $day" --notes-file release-notes.txt
